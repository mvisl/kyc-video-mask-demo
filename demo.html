.background::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 53% 47%, rgb(255 255 255 / 4%), transparent 36%),
    linear-gradient(180deg, rgb(0 0 0 / 3%), rgb(0 0 0 / 18%));
}

.status-bar {
  position: absolute;
  inset: 0 0 auto;
  height: 44px;
  font-size: 14px;
  font-weight: 700;
}

.time {
  position: absolute;
  left: 21px;
  top: 12px;
  width: 54px;
  text-align: center;
}

.notch {
  position: absolute;
  left: 78px;
  top: -2px;
  width: 219px;
  height: 30px;
  border-radius: 0 0 18px 18px;
  background: #000000;
}

.system-icons {
  position: absolute;
  right: 15px;
  top: 15px;
  font-size: 9px;
  letter-spacing: 0;
  opacity: 0.92;
}

.progress {
  position: absolute;
  left: 12px;
  top: 44px;
  display: flex;
  gap: 4px;
  width: 351px;
}

.progress-pill {
  width: 70px;
  height: 8px;
  border-radius: 26px;
  background: var(--progress-empty);
}

.progress-pill--wide {
  width: 84px;
}

.progress-pill--short {
  width: 28px;
}

.progress-pill--fill {
  flex: 1;
  width: auto;
}

.progress-pill--active {
  background: var(--progress-active);
}

.question-count {
  position: absolute;
  left: 12px;
  top: 58px;
  margin: 0;
  color: var(--text-primary);
  font-size: 14px;
  line-height: 18px;
  white-space: nowrap;
}

.question-count span {
  color: var(--text-secondary);
}

.heading {
  position: absolute;
  top: 178px;
  left: 0;
  width: 100%;
  margin: 0;
  text-align: center;
  color: var(--text-primary);
  font-size: 32px;
  font-weight: 300;
  line-height: 40px;
  letter-spacing: 0;
}

.heading span {
  display: block;
  color: var(--text-tertiary);
}

  left: 39px;
  top: 258px;
  width: 296px;
  height: 296px;

  cursor: default;
}

.next-button svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

  left: 50%;
  bottom: 8px;
  width: 134px;
  height: 5px;
  border-radius: 999px;
  background: #ffffff;

}

  position: fixed;
  left: -9999px;
  top: -9999px;
  width: 1px;
  height: 1px;
}

function drawFrame(time = 0) {
  const pulse = (Math.sin(time / 450) + 1) / 2;
  const glow = 0.92 + pulse * 0.08;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(2, 2);
  ctx.translate(-148, -148);
  ctx.filter = `brightness(${glow}) saturate(${1 + pulse * 0.12})`;
  ctx.drawImage(poster, 0, 0, 296, 296);
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = 0.08 + pulse * 0.1;
  const gradient = ctx.createRadialGradient(316, 358, 14, 316, 358, 130);
  gradient.addColorStop(0, "rgba(255, 164, 8, 0.75)");
  gradient.addColorStop(1, "rgba(255, 164, 8, 0)");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();

  requestAnimationFrame(drawFrame);
}
